spring:
  application:
    name: estoque-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pesujo}
    password: ${RABBITMQ_PASSWORD:pesujo}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
  datasource:
    url: jdbc:postgresql://${ESTOQUE_POSTGRES_HOST:localhost}:${ESTOQUE_POSTGRES_PORT:5433}/${ESTOQUE_POSTGRES_DB:estoque}
    username: ${ESTOQUE_POSTGRES_USER:estoque}
    password: ${ESTOQUE_POSTGRES_PASSWORD:estoque}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
server:
  port: 8081
