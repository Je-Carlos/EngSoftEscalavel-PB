spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///estoque?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
eureka:
  client:
    enabled: false
app:
  eventos:
    consumidores:
      enabled: false

logging:
  structured:
    format:
      console: ecs
