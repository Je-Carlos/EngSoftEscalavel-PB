services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-estoque:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ESTOQUE_POSTGRES_DB:-estoque}
      POSTGRES_USER: ${ESTOQUE_POSTGRES_USER:-estoque}
      POSTGRES_PASSWORD: ${ESTOQUE_POSTGRES_PASSWORD:-estoque}
    ports:
      - "${ESTOQUE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-estoque-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  service-registry:
    build:
      context: .
      args:
        MODULE: service-registry
    ports:
      - "8761:8761"

  backend:
    build:
      context: .
      args:
        MODULE: backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_started
    ports:
      - "8080:8080"

  estoque-service:
    build:
      context: .
      args:
        MODULE: estoque-service
    environment:
      ESTOQUE_POSTGRES_HOST: postgres-estoque
      ESTOQUE_POSTGRES_PORT: 5432
      ESTOQUE_POSTGRES_DB: ${ESTOQUE_POSTGRES_DB:-estoque}
      ESTOQUE_POSTGRES_USER: ${ESTOQUE_POSTGRES_USER:-estoque}
      ESTOQUE_POSTGRES_PASSWORD: ${ESTOQUE_POSTGRES_PASSWORD:-estoque}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres-estoque:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_started
    ports:
      - "8081:8081"

volumes:
  postgres-data:
  postgres-estoque-data:
  rabbitmq-data:
