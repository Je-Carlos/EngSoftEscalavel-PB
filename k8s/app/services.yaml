apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: pesujo}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports:
    - {port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: pesujo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/je-carlos/pesujo-frontend:IMAGE_TAG
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
