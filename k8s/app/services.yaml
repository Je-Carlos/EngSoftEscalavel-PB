apiVersion: v1
kind: Service
metadata: {name: service-registry, namespace: pesujo}
spec:
  selector: {app.kubernetes.io/name: service-registry}
  ports:
    - {port: 8761, targetPort: 8761}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: service-registry, namespace: pesujo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: service-registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: service-registry}
    spec:
      containers:
        - name: service-registry
          image: ghcr.io/je-carlos/pesujo-service-registry:IMAGE_TAG
          ports: [{containerPort: 8761}]
          env:
            - {name: JAVA_TOOL_OPTIONS, value: '-javaagent:/opt/otel/opentelemetry-javaagent.jar'}
            - {name: OTEL_SERVICE_NAME, value: service-registry}
            - {name: OTEL_METRICS_EXPORTER, value: none}
            - {name: OTEL_LOGS_EXPORTER, value: none}
          envFrom:
            - configMapRef: {name: pesujo-config}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8761}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8761}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8761}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: pesujo}
spec:
  selector: {app: backend}
  ports:
    - {port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: pesujo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend, app.kubernetes.io/name: backend}
    spec:
      containers:
        - name: backend
          image: ghcr.io/je-carlos/pesujo-backend:IMAGE_TAG
          ports: [{containerPort: 8080}]
          env:
            - {name: JAVA_TOOL_OPTIONS, value: '-javaagent:/opt/otel/opentelemetry-javaagent.jar'}
            - {name: OTEL_SERVICE_NAME, value: backend}
            - {name: OTEL_METRICS_EXPORTER, value: none}
            - {name: OTEL_LOGS_EXPORTER, value: none}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: pesujo-credentials, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: pesujo-credentials, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pesujo-credentials, key: POSTGRES_PASSWORD}
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: {name: pesujo-credentials, key: RABBITMQ_USER}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: {name: pesujo-credentials, key: RABBITMQ_PASSWORD}
          envFrom:
            - configMapRef: {name: pesujo-config}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 20
          resources:
            requests: {cpu: 150m, memory: 384Mi}
            limits: {cpu: 1500m, memory: 1Gi}
---
